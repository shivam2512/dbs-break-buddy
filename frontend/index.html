<!DOCTYPE html>
<html>
<head>
    <title>Break Buddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 48%;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        #startBtn { background: green; color:white; }
        #stopBtn { background: red; color:white; }

        .timer { font-size: 35px; margin-top: 10px; }
    </style>
</head>

<body>

<div class="container">

    <h2>⏳ Break Buddy</h2>

    <input id="empId" placeholder="Enter Employee ID">
    <button onclick="login()">Login</button>

    <h3 id="empName"></h3>

    <select id="reason">
    <option value="">Select Reason</option>
    <option>Tea Break</option>
    <option>Lunch Break</option>
    <option>Personal Work</option>
    <option>Meeting</option>
    <option>Feedback</option>
    <option>Quality Feedback</option> <!-- ✅ NEW -->
    <option>Operation Feedback</option> <!-- ✅ NEW -->
    <option>Other</option>
</select>

    <textarea id="extra" placeholder="Enter reason..." style="display:none;"></textarea>

    <div>
        <button id="startBtn" onclick="startBreak()" disabled>Start</button>
        <button id="stopBtn" onclick="stopBreak()" disabled>Stop</button>
    </div>

    <h3 id="currentBreak">🔴 Not on Break</h3>

    <div class="timer" id="timer">00:00</div>

    <div>
        Start: <span id="startTime">--</span><br>
        End: <span id="endTime">--</span>
    </div>

<div style="margin-top:15px; font-size:12px;">
    ⚠️ Found a bug? Mail to: 
    <a id="bugLink" href="#" style="color:#ffd700; text-decoration:underline;">
        shivamshinde786@gmail.com
    </a> <br>
    Last Updated: 06-May-26 02:55 PM IST
</div>


</div>


<script>

const API = "https://dbs-break-buddy-jm0m.onrender.com";

let emp_id = "";
let startTime = null;
let timerInt = null;
let isStopping = false; // ✅ NEW FLAG (stronger than userStopped)

const empIdInput = document.getElementById("empId");
const empNameEl = document.getElementById("empName");
const reasonSelect = document.getElementById("reason");
const extraInput = document.getElementById("extra");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const currentBreak = document.getElementById("currentBreak");
const timer = document.getElementById("timer");
const startTimeEl = document.getElementById("startTime");
const endTimeEl = document.getElementById("endTime");

function login(){
    emp_id = empIdInput.value.trim();

    if(!emp_id){
        alert("Enter Employee ID");
        return;
    }

    fetch(API+"/validate",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({emp_id})
    })
    .then(res=>res.json())
    .then(d=>{
        if(!d.valid){
            alert("Invalid ID");
            return;
        }

        empNameEl.innerText = "Welcome " + d.name;
        checkStatus();
    });
}

function checkStatus(){
    fetch(API+"/status",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({emp_id})
    })
    .then(res=>res.json())
    .then(d=>{

        if(d.active){
            startTime = new Date(d.start_time);
            startTimer();

            // ✅ FIX: include extra_reason
            let text = d.reason;

            if (d.extra_reason && d.extra_reason.trim() !== "") {
                text += " (" + d.extra_reason + ")";
            }

            currentBreak.innerText = "🟢 " + text;

            startBtn.disabled = true;
            stopBtn.disabled = false;

        } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
    });
}

function startTimer(){
    clearInterval(timerInt);

    timerInt = setInterval(() => {

        let sec = Math.floor((new Date() - startTime) / 1000);

        let h = Math.floor(sec / 3600);
        let m = Math.floor((sec % 3600) / 60);
        let s = sec % 60;

        timer.innerText = `${h}:${("0"+m).slice(-2)}:${("0"+s).slice(-2)}`;

        startTimeEl.innerText =
            new Date(startTime).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});

        // ❌ STOP polling if user clicked stop
        if (isStopping) return;

        fetch(API+"/status",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({emp_id})
        })
        .then(res=>res.json())
        .then(d=>{

            if(!d.active){

                clearInterval(timerInt);

                if(d.ended_by === "ADMIN"){
                    currentBreak.innerText = "🔴 Break Ended by Admin";
                    alert("Your break was ended by admin");
                } else {
                    currentBreak.innerText = "🔴 Not on Break";
                }

                endTimeEl.innerText =
                    new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});

                startBtn.disabled = false;
                stopBtn.disabled = true;
            }

        });

    },1000);
}

reasonSelect.addEventListener("change", ()=>{

    const requiresExtra = [
        "Personal Work",
        "Meeting",
        "Feedback",
        "Quality Feedback",     // ✅ NEW
        "Operation Feedback",   // ✅ NEW
        "Other"
    ];

    if (requiresExtra.includes(reasonSelect.value)) {
        extraInput.style.display = "block";
    } else {
        extraInput.style.display = "none";
        extraInput.value = ""; // reset
    }
});

function startBreak(){

    isStopping = false;

    // ✅ Validate reason selected
    if (!reasonSelect.value) {
        alert("Please select a reason");
        return;
    }

    // ✅ Reasons that REQUIRE extra input
    const requiresExtra = [
        "Personal Work",
        "Meeting",
        "Feedback",
        "Quality Feedback",
        "Operation Feedback",
        "Other"
    ];

    // ✅ Validate extra field
    if (requiresExtra.includes(reasonSelect.value) &&
        (!extraInput.value || extraInput.value.trim() === "")) {
        alert("Please enter reason details");
        return;
    }

    // ✅ API call
    fetch(API+"/start",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            emp_id,
            reason: reasonSelect.value,
            extra: extraInput.value
        })
    })
    .then(res=>res.json())
    .then(d=>{
        if(d.error){ 
            alert(d.error); 
            return; 
        }

        startTime = new Date(d.start_time);
        startTimer();

        currentBreak.innerText = "🟢 " + reasonSelect.value;

        startBtn.disabled = true;
        stopBtn.disabled = false;
    });
}

function stopBreak(){
    isStopping = true; // ✅ BLOCK polling instantly
    clearInterval(timerInt); // ✅ STOP timer immediately

    fetch(API+"/stop",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({emp_id})
    })
    .then(()=>{
        currentBreak.innerText = "🔴 Not on Break";

        endTimeEl.innerText =
            new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});

        startBtn.disabled = false;
        stopBtn.disabled = true;
    });
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("bugLink").addEventListener("click", () => {

        const subject = "Bug Report - Break Buddy";

        const body =
`Employee ID: ${emp_id || "Not Logged In"}

Describe the issue:
`;

        const gmailURL =
`https://mail.google.com/mail/?view=cm&fs=1&to=shivamshinde786@gmail.com&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        window.open(gmailURL, "_blank"); // opens Gmail in new tab
    });
