<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
body { font-family: Arial; background:#eef2f7; }
.container { max-width:1200px; margin:auto; }

.card {
    background:white;
    padding:15px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#333; color:white; }

button { padding:6px 10px; margin:3px; cursor:pointer; border:none; border-radius:5px; }
button:hover { opacity:0.9; }

.logout { background:red; color:white; }
.delete-btn { background:#dc3545; color:white; }
.quick-btn { background:#007bff; color:white; }
.reset-btn { background:gray; color:white; }

.top-bar { display:flex; justify-content:space-between; align-items:center; }

.filter-bar {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.no-data {
    text-align:center;
    padding:15px;
    color:#999;
}
</style>
</head>

<body>

<div class="container">

<div class="top-bar">
<h2>📊 Admin Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- Add Employee -->
<div class="card">
<h3>Add Employee</h3>
<input id="empName" placeholder="Enter name">
<button onclick="addEmployee()">Add</button>
<p id="msg"></p>
</div>

<!-- Employees -->
<div class="card">
<h3>Employees</h3>
<table id="empTable"></table>
</div>

<!-- Active -->
<div class="card">
<h3>Active Breaks</h3>
<table id="activeTable"></table>
</div>

<!-- Filter -->
<div class="card">
<h3>📅 Filter Logs</h3>

<div class="filter-bar">
    <input id="filterEmp" placeholder="EMP ID">

    <label>From:</label>
    <input type="date" id="from">

    <label>To:</label>
    <input type="date" id="to">

    <button onclick="filterLogs()">Search</button>
    <button class="reset-btn" onclick="resetFilters()">Reset</button>

    <button class="quick-btn" onclick="quickFilter('today')">Today</button>
    <button class="quick-btn" onclick="quickFilter('yesterday')">Yesterday</button>
    <button class="quick-btn" onclick="quickFilter('7days')">Last 7 Days</button>
</div>

</div>

<!-- Logs -->
<div class="card">
<h3>📄 Logs</h3>
<button onclick="exportCSV()">Download CSV</button>
<table id="logTable"></table>
</div>

</div>

<script>

const API = "https://dbs-break-buddy.onrender.com";
const token = localStorage.getItem("admin_token");

// 🔒 Protect page
if (!token) window.location.replace("admin-login.html");

// Session check
setInterval(() => {
    fetch(API + "/employees", {
        headers: { "Authorization": token }
    }).then(res => {
        if (res.status === 401) {
            alert("Session expired");
            localStorage.removeItem("admin_token");
            window.location.replace("admin-login.html");
        }
    });
}, 30000);

// Prevent back
history.pushState(null, null, location.href);
window.onpopstate = () => history.go(1);

// Format duration
function formatDuration(sec){
    if(!sec) return "-";
    let h = Math.floor(sec / 3600);
    let m = Math.floor((sec % 3600) / 60);
    let s = sec % 60;
    return `${h}:${("0"+m).slice(-2)}:${("0"+s).slice(-2)}`;
}

// Logout
function logout(){
    localStorage.removeItem("admin_token");
    window.location.href="admin-login.html";
}

// Add employee
function addEmployee(){
    fetch(API+"/add-employee",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization": token
        },
        body:JSON.stringify({name:empName.value})
    })
    .then(r=>r.json())
    .then(d=>{
        msg.innerText="Created: "+d.emp_id;
        empName.value="";
        loadEmployees();
    });
}

// ✅ Load employees with DELETE
function loadEmployees(){
    fetch(API+"/employees",{ headers:{ "Authorization": token }})
    .then(r=>r.json())
    .then(data=>{
        let html="<tr><th>ID</th><th>Name</th><th>Action</th></tr>";

        data.forEach(e=>{
            html+=`<tr>
                <td>${e.emp_id}</td>
                <td>${e.name}</td>
                <td>
                    <button class="delete-btn"
                        onclick="deleteEmp('${e.emp_id}')">
                        Delete
                    </button>
                </td>
            </tr>`;
        });

        empTable.innerHTML=html;
    });
}

// ✅ Delete employee
function deleteEmp(id){
    if(!confirm(`Delete employee ${id}? This cannot be undone.`)) return;

    fetch(API+"/delete-employee/"+id,{
        method:"DELETE",
        headers:{ "Authorization": token }
    })
    .then(()=> loadEmployees());
}

// Active breaks
function loadActive(){
    fetch(API+"/active-breaks",{ headers:{ "Authorization": token }})
    .then(r=>r.json())
    .then(data=>{
        let html="<tr><th>ID</th><th>Name</th><th>Reason</th><th>Extra</th><th>Action</th></tr>";

        data.forEach(e=>{
            html+=`<tr>
            <td>${e.emp_id}</td>
            <td>${e.employee_name}</td>
            <td>${e.reason}</td>
            <td>${e.extra_reason || "-"}</td>
            <td><button onclick="forceStop('${e.emp_id}')">Force Stop</button></td>
            </tr>`;
        });

        activeTable.innerHTML=html;
    });
}

// Force stop
function forceStop(emp_id){
    fetch(API+"/force-stop",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization": token
        },
        body:JSON.stringify({emp_id})
    }).then(()=>{
        loadActive();
        filterLogs();
    });
}

// FILTER LOGS
function filterLogs(){
    fetch(API+"/filter-logs",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization": token
        },
        body:JSON.stringify({
            emp_id:filterEmp.value,
            from:from.value,
            to:to.value
        })
    })
    .then(r=>r.json())
    .then(showLogs);
}

// STORE CURRENT VIEW
let currentLogs = [];

// SHOW LOGS
function showLogs(data){

    currentLogs = data;

    if(!data.length){
        logTable.innerHTML = `<tr><td class="no-data">No records found</td></tr>`;
        return;
    }

    let html=`<tr>
    <th>ID</th><th>Name</th><th>Reason</th>
    <th>Extra</th><th>Start</th><th>End</th>
    <th>Duration</th><th>Ended By</th>
    </tr>`;

    data.forEach(e=>{
        html+=`<tr>
        <td>${e.emp_id}</td>
        <td>${e.employee_name}</td>
        <td>${e.reason}</td>
        <td>${e.extra_reason || "-"}</td>
        <td>${e.start_time}</td>
        <td>${e.end_time||"-"}</td>
        <td>${formatDuration(e.duration)}</td>
        <td>${e.ended_by || "-"}</td>
        </tr>`;
    });

    logTable.innerHTML=html;
}

// QUICK FILTERS
function formatDateLocal(date) {
    let d = new Date(date);
    let year = d.getFullYear();
    let month = ("0" + (d.getMonth() + 1)).slice(-2);
    let day = ("0" + d.getDate()).slice(-2);
    return `${year}-${month}-${day}`;
}

function quickFilter(type){
    let today = new Date();
    let fromDate, toDate;

    if(type==="today"){
        fromDate = toDate = today;
    }
    else if(type==="yesterday"){
        let y = new Date();
        y.setDate(y.getDate()-1);
        fromDate = toDate = y;
    }
    else if(type==="7days"){
        toDate = today;
        fromDate = new Date();
        fromDate.setDate(today.getDate()-6);
    }

    from.value = formatDateLocal(fromDate);
    to.value = formatDateLocal(toDate);

    filterLogs();
}

// CSV EXPORT (VISIBLE DATA ONLY)
function exportCSV(){

    if(!currentLogs.length){
        alert("No data to export");
        return;
    }

    let csv = "Emp ID,Name,Reason,Extra Details,Start,End,Duration,Ended By\n";

    currentLogs.forEach(e => {
        csv += `${e.emp_id},${e.employee_name},${e.reason},${e.extra_reason || ""},"${e.start_time}","${e.end_time || ""}",${formatDuration(e.duration)},${e.ended_by || ""}\n`;
    });

    let blob = new Blob([csv], { type: "text/csv" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "Break_Logs.csv";
    a.click();
}

// INIT
loadEmployees();
loadActive();
quickFilter("today");

</script>

</body>
</html>
